{% set name = "zcollection" %}
{% set version = "0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
    path: ..

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [linux32 or win32 or py<312]

requirements:
  host:
    - python
    - pip
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
  run:
    - dask >=2022.8.0
    - distributed
    - fasteners
    - fsspec
    - numcodecs
    - numpy >=1.20
    - python >=3.12
    - xarray
    - zarr >=3.4
test:
  requires:
    - pytest
  commands:
    - pytest --pyargs zcollection

about:
  home: https://github.com/CNES/zcollection
  license: Proprietary
  license_family: Proprietary
  summary: 'Handle a collection of Zarr groups'
  doc_url: https://zcollection.readthedocs.io/en/latest/
  dev_url: https://github.com/CNES/zcollection
