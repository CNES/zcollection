{% set name = "zcollection" %}
{% set version = "0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
    path: ..

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --use-feature=in-tree-build
  skip: true  # [linux32 or win32 or py<311]

requirements:
  build:
    - python
  run:
    - dask >=2022.8.0
    - distributed
    - fasteners
    - fsspec <=2025.12.0
    - numcodecs <0.16
    - numpy >=1.20
    - pandas
    - python >=3.11
    - xarray
    - zarr >=2.11,<3
test:
  requires:
    - pytest
  commands:
    - pytest --pyargs zcollection

about:
  home: https://github.com/CNES/zcollection
  license: Proprietary
  license_family: Proprietary
  summary: 'Handle a collection of Zarr groups'
  doc_url: https://zcollection.readthedocs.io/en/latest/
  dev_url: https://github.com/CNES/zcollection
