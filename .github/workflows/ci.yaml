name: CI

on:
  push:
    branches: "**"
  pull_request:
    branches: main

jobs:
  linux:
    name: ${{ matrix.python-version }}-posix
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        cache-downloads: true
        cache-downloads-key: downloads-linux-py${{ matrix.python-version }}-${{ hashFiles('conda/environment.yml') }}
        condarc: |
          channels:
            - conda-forge
        create-args: |
          python=${{ matrix.python-version }}
        environment-name: ZCollection
        environment-file: conda/environment.yml

    - name: Run Tests
      shell: bash -l {0}
      run: |
        python -m setuptools_scm
        if [[ ! -e zcollection/version.py ]]; then
          echo "__version__ = '$(git describe --tags --always)'" > zcollection/version.py
        fi
        pytest -v -ra --processes

  s3-fs:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        cache-downloads: true
        cache-downloads-key: downloads-s3-py3.12-${{ hashFiles('conda/environment.yml') }}
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          python=3.12
          minio-server=2025.10.15.17.29.55
        environment-name: ZCollection
        environment-file: conda/environment.yml

    - name: Run Tests
      shell: bash -l {0}
      run: |
        python -m setuptools_scm
        if [[ ! -e zcollection/version.py ]]; then
          echo "__version__ = '$(git describe --tags --always)'" > zcollection/version.py
        fi
        pytest -v -ra --s3 --processes

  win:
    name: win
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        cache-downloads: true
        cache-downloads-key: downloads-win-py3.12-${{ hashFiles('conda/environment.yml') }}
        condarc: |
          channels:
            - conda-forge
        create-args: |
          python=3.12
        environment-name: ZCollection
        environment-file: conda/environment.yml

    - name: Run Tests
      shell: bash -l {0}
      run: |
        python -m setuptools_scm
        if [[ ! -e zcollection/version.py ]]; then
          echo "__version__ = '$(git describe --tags --always)'" > zcollection/version.py
        fi
        pytest -v -ra --processes
